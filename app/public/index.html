<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f7f7f5;
    color: #2c2c2a;
  }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { color: #6b6a63; font-size: 14px; margin-bottom: 24px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    font-size: 15px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #0f6e56;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #085041; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    border: 1px solid #e5e4dc;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  li.done .title { text-decoration: line-through; color: #9a998f; }
  .title { flex: 1; font-size: 15px; }
  .delete-btn {
    background: none;
    color: #a32d2d;
    padding: 4px 8px;
    font-size: 13px;
  }
  .delete-btn:hover { background: #fcebeb; }
  .empty { color: #9a998f; font-size: 14px; text-align: center; padding: 20px 0; }
  .error { color: #a32d2d; font-size: 13px; margin-top: -12px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
  <h1>Todo</h1>
  <div class="subtitle" id="status">Loading…</div>

  <div class="add-row">
    <input type="text" id="new-title" placeholder="What needs doing?" maxlength="200">
    <button id="add-btn">Add</button>
  </div>
  <div class="error" id="error-msg"></div>

  <ul id="todo-list"></ul>
  <div class="empty" id="empty-msg" style="display:none;">No todos yet — add one above.</div>

<script>
const listEl = document.getElementById('todo-list');
const emptyEl = document.getElementById('empty-msg');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error-msg');
const input = document.getElementById('new-title');
const addBtn = document.getElementById('add-btn');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  setTimeout(() => { errorEl.style.display = 'none'; }, 4000);
}

async function loadTodos() {
  try {
    const res = await fetch('/todos');
    if (!res.ok) throw new Error('Failed to load todos');
    const todos = await res.json();
    render(todos);
    statusEl.textContent = todos.length + (todos.length === 1 ? ' item' : ' items');
  } catch (err) {
    statusEl.textContent = 'Could not connect to server';
    showError(err.message);
  }
}

function render(todos) {
  listEl.innerHTML = '';
  emptyEl.style.display = todos.length === 0 ? 'block' : 'none';
  todos.forEach(todo => {
    const li = document.createElement('li');
    li.className = todo.done ? 'done' : '';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = todo.done;
    checkbox.addEventListener('change', () => toggleDone(todo.id, checkbox.checked));

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = todo.title;

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => deleteTodo(todo.id));

    li.append(checkbox, title, delBtn);
    listEl.appendChild(li);
  });
}

async function addTodo() {
  const title = input.value.trim();
  if (!title) {
    showError('Enter a title first');
    return;
  }
  addBtn.disabled = true;
  try {
    const res = await fetch('/todos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    if (!res.ok) throw new Error('Failed to add todo');
    input.value = '';
    await loadTodos();
  } catch (err) {
    showError(err.message);
  } finally {
    addBtn.disabled = false;
  }
}

async function toggleDone(id, done) {
  try {
    const res = await fetch('/todos/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done })
    });
    if (!res.ok) throw new Error('Failed to update todo');
    await loadTodos();
  } catch (err) {
    showError(err.message);
  }
}

async function deleteTodo(id) {
  try {
    const res = await fetch('/todos/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error('Failed to delete todo');
    await loadTodos();
  } catch (err) {
    showError(err.message);
  }
}

addBtn.addEventListener('click', addTodo);
input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

loadTodos();
</script>
</body>
</html>
